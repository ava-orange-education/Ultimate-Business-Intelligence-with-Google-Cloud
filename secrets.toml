# ============================================================
# NordLeaf BI Platform - Secrets & API Keys
# ============================================================
# !! NEVER COMMIT THIS FILE TO GIT !!
# secrets.toml is listed in .gitignore.
#
# Fill in values before running nordleaf_setup.py.
# Use Google Secret Manager for production deployments.
# ============================================================

# ============================================================
# GCP CREDENTIALS
# ============================================================
[GCP]
# Absolute path to a service account JSON key.
# Leave empty ("") to rely on Application Default Credentials (ADC):
#   gcloud auth application-default login
service_account_key_path = ""

# Your GCP billing account ID (for project creation / budget alerts).
# Find it at: https://console.cloud.google.com/billing
billing_account_id = ""

# ============================================================
# ALERTING
# ============================================================
[ALERTS]
# Recipient(s) for pipeline failure emails (comma-separated).
alert_email     = "data-alerts@nordleaf.fi"
ops_email       = "ops@nordleaf.fi"

# Optional: Slack webhook URL for pipeline notifications.
slack_webhook   = ""

# ============================================================
# EXTERNAL DATA SOURCES (add as your use-cases require)
# ============================================================
[EXTERNAL_APIS]
# Weather API (e.g. Open-Meteo - free, no key needed; or add key here).
weather_api_key = ""

# Carbon footprint API key (e.g. Climatiq).
carbon_api_key  = ""

# ERP / SAP integration token (for live order feed).
erp_api_token   = ""

# ============================================================
# LOOKER STUDIO / BI TOOLS
# ============================================================
[BI_TOOLS]
# Service account email that Looker Studio uses to query BigQuery.
# Grant this SA roles/bigquery.dataViewer in IAM.
looker_sa_email = "nordleaf-bi-reader@vision-af83a.iam.gserviceaccount.com"

# ============================================================
# SECRET MANAGER REFERENCES
# (Alternative: store secrets in GCP Secret Manager and reference here)
# ============================================================
# [SECRET_MANAGER]
# project_id   = "GOOGLE_PROJECT_ID
# alert_email  = "projects/GOOGLE_PROJECT_ID/secrets/alert-email/versions/latest"
